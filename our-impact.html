    <style>
        ul {
            padding-left: 17px;
        }

        .csp-hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('images/AUB-OSB-ExEd-Impact-Banner-Pattern.png') center / cover no-repeat;

        .csp-card {
            background: var(--color-bg-light);
        }


        .csp-card__content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .csp-card__scroll-area {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE/Edge */
            scrollbar-color: var(--color-text-muted);
            position: relative;
        }

        /* Custom scrollbar for WebKit */
        .csp-card__scroll-area::-webkit-scrollbar {
            width: 6px;
            display: none;
        }

        /* Show scrollbar on card hover */
        .csp-card:hover .csp-card__scroll-area {
            scrollbar-width: thin;
            -ms-overflow-style: auto;
        }

        .csp-card:hover .csp-card__scroll-area::-webkit-scrollbar {
            display: block;
            width: 6px;
        }

        .csp-card:hover .csp-card__scroll-area::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .csp-card:hover .csp-card__scroll-area::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        .csp-card:hover .csp-card__scroll-area::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary-dark);
        }

        /* Hide the gradient indicator on hover (optional but cleaner) */
        .csp-card:hover .csp-card__gradient::after {
            opacity: 0;
        }


        .csp-card__scroll-area::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .csp-card__scroll-area::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        .csp-card__scroll-area::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary-dark);
        }

        /* Gradient overlay to indicate more content */
        .csp-card__gradient {
            position: relative;
        }

        .csp-card__gradient::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--color-bg-light));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 0 0 12px 12px;
        }

        .csp-card__gradient.show-gradient {
            border-radius: 0 0 10px 10px;
            overflow: hidden;
        }

        .csp-card__gradient.show-gradient::after {
            opacity: 1;
        }

        .csp-card__title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 1rem;
            height: 50px;
        }

        .csp-card__text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2d3e50;
        }

        .csp-card__text p {
            margin-bottom: 0.75rem;
        }

        .csp-card__text ul {
            margin: 0.5rem 0 1rem 1.5rem;
        }

        .csp-card__text li {
            margin-bottom: 0.25rem;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        @media (max-width: 768px) {
            .csp-hero h1 {
                font-size: 2rem;
            }

            .container {
                padding: 0 1rem;
            }
        }
    </style>

</head>

        function createCard(program) {
            const card = document.createElement('div');
            card.className = 'csp-card';
            card.setAttribute('data-aos', 'fade-up');

            // Image section
            const imgDiv = document.createElement('div');
            imgDiv.className = 'csp-card__image';
            const img = document.createElement('img');
            img.src = program.image;
            img.alt = program.alt;
            img.loading = 'lazy';
            imgDiv.appendChild(img);

            // Content section with gradient wrapper
            const contentDiv = document.createElement('div');
            contentDiv.className = 'csp-card__content';

            const titleDiv = document.createElement('div');
            titleDiv.className = 'csp-card__title';
            titleDiv.textContent = program.title;

            // Scroll area
            const scrollArea = document.createElement('div');
            scrollArea.className = 'csp-card__scroll-area';
            const textDiv = document.createElement('div');
            textDiv.className = 'csp-card__text';
            textDiv.innerHTML = program.content;
            scrollArea.appendChild(textDiv);

            // Gradient container
            const gradientWrapper = document.createElement('div');
            gradientWrapper.className = 'csp-card__gradient';
            gradientWrapper.appendChild(scrollArea);

            contentDiv.appendChild(titleDiv);
            contentDiv.appendChild(gradientWrapper);

            card.appendChild(imgDiv);
            card.appendChild(contentDiv);

            // Function to check overflow and scroll position
            function updateGradient() {
                const scrollEl = scrollArea;
                const gradientEl = gradientWrapper;
                if (scrollEl.scrollHeight > scrollEl.clientHeight) {
                    // Content overflows
                    const isAtBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 5;
                    if (isAtBottom) {
                        gradientEl.classList.remove('show-gradient');
                    } else {
                        gradientEl.classList.add('show-gradient');
                    }
                } else {
                    gradientEl.classList.remove('show-gradient');
                }
            }

            // Initial check and add event listeners
            setTimeout(updateGradient, 100); // wait for images to load maybe
            scrollArea.addEventListener('scroll', updateGradient);
            window.addEventListener('resize', updateGradient);
            // Also observe image loading? Simple: call after a delay and when image loads
            if (img.complete) updateGradient();
            else img.addEventListener('load', updateGradient);

            return card;
        }

        function renderGrid() {
            const grid = document.getElementById('csp-grid');
            programs.forEach(program => {
                grid.appendChild(createCard(program));
            });
            AOS.refresh();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            AOS.init({ duration: 800, once: true });
            lucide.createIcons();
        });
    </script>
